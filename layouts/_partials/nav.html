<nav class="nav">
  <a href="{{ "/" | relURL }}"{{ if .IsHome }} class="active"{{ end }}>home</a>
  <a href="{{ "/posts/" | relURL }}"{{ if eq .Section "posts" }} class="active"{{ end }}>posts</a>
  <a href="{{ "/tags/" | relURL }}"{{ if eq .Type "tags" }} class="active"{{ end }}>tags</a>
  {{- with site.Params.github }}
  <a href="https://github.com/{{ . }}" target="_blank" rel="noopener noreferrer">github</a>
  {{- end }}
  {{- with site.Params.twitter }}
  <a href="https://x.com/{{ . }}" target="_blank" rel="noopener noreferrer">x</a>
  {{- end }}
  <button class="theme-toggle" type="button" aria-label="Toggle colour theme">theme</button>
</nav>
