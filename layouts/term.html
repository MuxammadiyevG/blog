{{ define "header" }}
  <div class="subhead">#{{ .Title | urlize }}</div>
  <div class="rel">{{ i18n "releaseCount" (dict "Count" (len .Pages)) }}</div>
{{ end }}

{{ define "main" }}
  {{ partial "rule.html" . }}

  <div class="posts">
    {{- range .Pages }}
      {{ partial "post-card.html" . }}
    {{- end }}
  </div>

  <div class="pager"><a href="{{ "/tags/" | relLangURL }}">[ {{ i18n "allTags" }} ]</a></div>
{{ end }}
